name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show versions
        run: flutter --version

      - name: Get packages
        run: flutter pub get

      # No --dart-define flags on purpose: with BASE_URL empty the app runs on
      # mock data and skips Firebase, so no google-services.json is needed.
      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bunpod-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
